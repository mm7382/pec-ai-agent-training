  <header class="lab-header"><a href="index.html" class="lab-brand">未來實驗室</a><nav aria-label="主要分頁"><a href="index.html">首頁</a><a href="worlds.html">AI 世界</a><a href="works.html">作品</a><a href="learning.html">學習資源</a><a href="journal.html">學習日誌</a><a href="about.html">關於本站</a><a aria-current="page" href="services.html">技術合作</a></nav></header>
  <main class="workshop">
    <section class="workshop-hall" aria-labelledby="servicesTitle">
      <img class="workshop-art" src="assets/campaign/collaboration-light-rail.webp" width="1536" height="1024" alt="" fetchpriority="high">
      <div class="workshop-copy">
        <h1 id="servicesTitle">共同試作</h1>
        <p>從一個問題開始</p>
        <details class="workshop-contact" id="project-contact">
          <summary>一起創作 <span aria-hidden="true">↗</span></summary>
          <section class="workshop-note" aria-labelledby="inquiryBriefTitle">
            <h2 id="inquiryBriefTitle">怎麼開頭？</h2>
            <p id="inquiry-brief">寄封信，簡單說說這三件事就好：</p>
            <ol>
              <li>你現在想做什麼？</li>
              <li>目前卡在哪裡？</li>
              <li>希望一起先試哪一步？</li>
            </ol>
            <div class="collab-actions">
              <a class="collab-email" href="mailto:mm7382@gmail.com" data-static-mail>寫信給我</a>
              <button class="collab-copy" type="button" id="copyContactAddress">複製信箱</button>
            </div>
            <p class="collab-status" id="copyContactStatus" role="status"></p>
          </section>
        </details>
      </div>
    </section>
  </main>
  <script>
    function openContactFromLink() {
      if (!['#project-contact', '#inquiry-brief'].includes(location.hash)) return;
      const contact = document.getElementById('project-contact');
      contact.open = true;
      requestAnimationFrame(() => contact.scrollIntoView({ block: 'nearest' }));
    }
    addEventListener('hashchange', openContactFromLink);
    openContactFromLink();
    document.getElementById('copyContactAddress').addEventListener('click', async () => {
      const status = document.getElementById('copyContactStatus');
      const address = new URL(document.querySelector('.collab-email').href).pathname;
      try {
        await navigator.clipboard.writeText(address);
        status.textContent = '已複製信箱。';
      } catch {
        status.textContent = '無法自動複製，請使用「寫信給我」。';
      }
    });
  </script>
</body>

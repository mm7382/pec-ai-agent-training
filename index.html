    <script>
      (() => {
        const section=document.getElementById('site-tour');
        const video=document.getElementById('site-tour-video');
        const playButton=section.querySelector('[data-play]');
        const soundButton=section.querySelector('[data-sound]');
        const message=section.querySelector('[data-video-error]');
        const reduced=matchMedia('(prefers-reduced-motion: reduce)');
        let manual=false, sourceFailed=false;
        video.defaultMuted=true;
        video.muted=true;
        playButton.hidden=false;
        soundButton.hidden=false;
        const sync=()=>{
          playButton.setAttribute('aria-pressed',String(!video.paused&&!video.ended));
          soundButton.setAttribute('aria-pressed',String(!video.muted&&video.volume>0));
        };
        const start=(explicit)=>{
          if(explicit){
            message.hidden=true;
            if(sourceFailed||video.error||video.networkState===3){sourceFailed=false;video.load();}
            if(video.ended)video.currentTime=0;
          }
          const playback=video.play();
          playback?.catch(error=>{if(explicit&&error.name!=='AbortError')message.hidden=false;});
        };
        playButton.addEventListener('click',()=>{
          manual=true;
          if(!video.paused&&!video.ended){video.pause();return;}
          start(true);
        });
        soundButton.addEventListener('click',()=>{
          manual=true;
          if(!video.muted&&video.volume>0){video.muted=true;sync();return;}
          video.muted=false;
          if(video.volume===0)video.volume=1;
          start(true);
          sync();
        });
        ['play','pause','ended','volumechange'].forEach(type=>video.addEventListener(type,sync));
        video.addEventListener('playing',()=>{message.hidden=true;sync();});
        ['pointerdown','keydown','touchstart'].forEach(type=>video.addEventListener(type,()=>{manual=true},{passive:true}));
        const showError=()=>{sourceFailed=true;message.hidden=false;sync();};
        video.addEventListener('error',showError);
        video.querySelector('source').addEventListener('error',showError);
        if(video.error)showError();
        if('IntersectionObserver' in window)new IntersectionObserver(entries=>{
          if(manual||!video.muted)return;
          if(entries.some(entry=>entry.isIntersecting)){if(!reduced.matches&&!video.ended)start(false);}
          else if(!video.paused)video.pause();
        },{threshold:.25}).observe(video);
      })();
    </script>

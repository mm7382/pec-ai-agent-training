    <script>
      (() => {
        const section=document.getElementById('site-tour');
        const button=section.querySelector('button');
        const video=document.getElementById('site-tour-video');
        const reduced=matchMedia('(prefers-reduced-motion: reduce)');
        let manual=false;
        button.hidden=false;
        const sync=()=>button.setAttribute('aria-pressed',String(!video.muted&&video.volume>0));
        const play=()=>video.play().catch(()=>{});
        button.addEventListener('click',()=>{
          manual=true;
          if(!video.muted&&video.volume>0){video.muted=true;sync();return;}
          video.muted=false;
          if(video.volume===0)video.volume=1;
          video.currentTime=0;
          sync();play();
        });
        video.addEventListener('volumechange',sync);
        ['pointerdown','keydown'].forEach(type=>video.addEventListener(type,()=>{manual=true}));
        const showError=()=>{button.hidden=true;section.querySelector('[data-video-error]').hidden=false};
        video.addEventListener('error',showError);
        if(video.error)showError();
        if('IntersectionObserver' in window)new IntersectionObserver(entries=>{
          if(manual||!video.muted)return;
          if(entries.some(entry=>entry.isIntersecting)){if(!reduced.matches&&!video.ended)play()}
          else if(!video.paused)video.pause();
        },{threshold:.25}).observe(video);
      })();
    </script>

  <style>
    .world-intro { padding: clamp(1.6rem, 3vw, 3rem) 4vw; }
    .world-intro h1, .world-scene h2 {
      margin: 0;
      font: 500 clamp(2rem, 4.3vw, 4.6rem)/1.12 Georgia, 'Songti TC', serif;
    }
    .world-intro p { margin: .65rem 0 0; }
    .world-showcase { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .world-scene {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: end;
      min-height: clamp(290px, 29vw, 540px);
      color: #fff9eb;
      background: #283332;
    }
    .world-scene-featured { grid-column: 1 / -1; align-items: center; min-height: clamp(370px, 35vw, 660px); }
    .world-scene img, .world-scene::before { position: absolute; inset: 0; width: 100%; height: 100%; }
    .world-scene img { z-index: -2; object-fit: cover; }
    .world-scene::before {
      content: "";
      z-index: -1;
      background: linear-gradient(0deg, rgba(20,17,13,.88), rgba(20,17,13,.62) 27%, transparent 70%);
    }
    .world-scene-featured::before {
      background: linear-gradient(90deg, rgba(10,24,29,.92), rgba(10,24,29,.72) 25%, transparent 78%);
    }
    .world-scene-copy { padding: clamp(1.4rem, 4vw, 4rem); }
    .world-scene h2 { font-size: clamp(1.85rem, 3.2vw, 3.4rem); }
    .world-scene-featured h2 { font-size: clamp(2.45rem, 5.2vw, 5.8rem); }
    .world-scene h2::before { display: block; width: 2.5rem; height: 2px; margin-bottom: .85rem; background: #f69670; content: ""; }
    .world-scene-actions { display: flex; flex-wrap: wrap; gap: .65rem 1rem; margin-top: 1rem; }
    .world-scene-actions a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: .15rem .85rem;
      border: 1px solid #fff9eb;
      border-radius: 4px;
      color: inherit;
      font-size: .94rem;
      font-weight: 600;
      text-decoration: none;
      background: rgba(27,22,17,.64);
    }
    .world-scene-actions a:first-child { border-color: #a54229; background: #8e301d; }
    .world-scene-actions a:hover { text-decoration: underline; text-underline-offset: .2em; }
    .world-scene-actions a:focus-visible { outline: 3px solid #fff9eb; outline-offset: 4px; }
    @media (max-width: 720px) {
      .world-showcase { grid-template-columns: minmax(0, 1fr); }
      .world-scene-featured { align-items: end; }
      .world-scene-featured::before {
        background: linear-gradient(0deg, rgba(10,24,29,.94), rgba(10,24,29,.65) 32%, transparent 75%);
      }
      .world-scene-featured img { object-position: 60% center; }
    }
  </style>

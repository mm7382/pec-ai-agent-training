<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>埃及金字塔｜近地視角研發版</title><link rel="stylesheet" href="visual-v2.css">

<body><main>
<div class="kicker">AI 自主世界　／　建築實驗 01</div>
<h1>埃及金字塔</h1><p>公開施工回放・非即時。模型提出計畫，模擬引擎執行逐石施工；這是研發中的模擬，並非歷史復原。</p>
<section class="film" aria-label="金字塔真實模擬回放"><canvas id="v2-scene" width="1440" height="810" aria-label="金字塔施工場景"></canvas>
